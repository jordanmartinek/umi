<svg width="320" height="120" viewBox="0 0 320 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Umi Umi">
  <defs>
    <!-- Braided cord gradient -->
    <linearGradient id="cord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5A5A"/>
      <stop offset="0.5" stop-color="#E23B3B"/>
      <stop offset="1" stop-color="#C21F2E"/>
    </linearGradient>
    <linearGradient id="cordShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Evil-eye bead gradients -->
    <radialGradient id="beadWhite" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#EAF6FF"/>
      <stop offset="1" stop-color="#CFE6F5"/>
    </radialGradient>
    <radialGradient id="beadBlue" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#3FA9F5"/>
      <stop offset="0.6" stop-color="#1E6FD6"/>
      <stop offset="1" stop-color="#0B3D91"/>
    </radialGradient>
    <radialGradient id="beadPupil" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#2A2A38"/>
      <stop offset="1" stop-color="#0A0A14"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#C21F2E" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- ===== LOGO MARK: braided cord bracelet loop + evil-eye bead ===== -->
  <g transform="translate(60 60)" filter="url(#soft)">
    <!-- Adjustable cord tails with knots (charming little dangly bits) -->
    <g stroke="url(#cord)" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M -30 30 q -14 10 -22 22"/>
      <path d="M 30 30 q 14 10 22 22"/>
    </g>
    <circle cx="-52" cy="52" r="5" fill="url(#cord)"/>
    <circle cx="52" cy="52" r="5" fill="url(#cord)"/>

    <!-- The bracelet loop, drawn as a braided (dashed) red cord ring -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#cord)" stroke-width="13"/>
    <!-- Braid stitches -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#8E1420" stroke-width="13"
            stroke-dasharray="3 9" stroke-opacity="0.35" stroke-linecap="round"
            transform="rotate(12)"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#FFB3B3" stroke-width="4"
            stroke-dasharray="5 9" stroke-opacity="0.7" stroke-linecap="round"
            transform="rotate(-8)"/>
    <!-- Top highlight sheen on the cord -->
    <path d="M -28 -28 A 40 40 0 0 1 28 -28" fill="none" stroke="url(#cordShine)"
          stroke-width="4.5" stroke-linecap="round"/>

    <!-- Evil-eye bead as the smile / focal charm -->
    <g transform="translate(0 6)">
      <circle cx="0" cy="0" r="20" fill="url(#beadWhite)"/>
      <circle cx="0" cy="0" r="14.5" fill="url(#beadBlue)"/>
      <circle cx="0" cy="0" r="8" fill="#EAF6FF"/>
      <circle cx="0" cy="0" r="5" fill="url(#beadPupil)"/>
      <!-- glossy catchlights make it feel alive & friendly -->
      <circle cx="-2.4" cy="-2.4" r="1.7" fill="#FFFFFF"/>
      <circle cx="6" cy="-6" r="2.6" fill="#FFFFFF" fill-opacity="0.85"/>
    </g>

    <!-- Tiny sparkle for charm -->
    <g fill="#FFD98A">
      <path d="M 30 -34 l 1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6 z"/>
    </g>
  </g>

  <!-- ===== WORDMARK ===== -->
  <g transform="translate(120 0)">
    <text x="0" y="58" font-family="'Cormorant Garamond', 'Playfair Display', serif"
          font-style="italic" font-weight="500" font-size="42" fill="#2C6E6A">umi</text>
    <text x="0" y="96" font-family="'Cormorant Garamond', 'Playfair Display', serif"
          font-style="italic" font-weight="500" font-size="42" fill="#E23B3B">umi</text>
    <!-- little cord accent under the wordmark -->
    <path d="M 2 104 q 45 -12 96 0" fill="none" stroke="url(#cord)" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="1 7"/>
  </g>
</svg>
