<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Umi Umi">
  <defs>
    <linearGradient id="cordM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5A5A"/>
      <stop offset="0.5" stop-color="#E23B3B"/>
      <stop offset="1" stop-color="#C21F2E"/>
    </linearGradient>
    <linearGradient id="cordShineM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="beadWhiteM" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#EAF6FF"/>
      <stop offset="1" stop-color="#CFE6F5"/>
    </radialGradient>
    <radialGradient id="beadBlueM" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#3FA9F5"/>
      <stop offset="0.6" stop-color="#1E6FD6"/>
      <stop offset="1" stop-color="#0B3D91"/>
    </radialGradient>
    <radialGradient id="beadPupilM" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#2A2A38"/>
      <stop offset="1" stop-color="#0A0A14"/>
    </radialGradient>
  </defs>

  <g transform="translate(60 56)">
    <!-- cord tails + knots -->
    <g stroke="url(#cordM)" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M -30 30 q -12 9 -19 19"/>
      <path d="M 30 30 q 12 9 19 19"/>
    </g>
    <circle cx="-49" cy="49" r="4.5" fill="url(#cordM)"/>
    <circle cx="49" cy="49" r="4.5" fill="url(#cordM)"/>

    <!-- braided ring -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#cordM)" stroke-width="13"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#8E1420" stroke-width="13"
            stroke-dasharray="3 9" stroke-opacity="0.35" stroke-linecap="round" transform="rotate(12)"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#FFB3B3" stroke-width="4"
            stroke-dasharray="5 9" stroke-opacity="0.7" stroke-linecap="round" transform="rotate(-8)"/>
    <path d="M -28 -28 A 40 40 0 0 1 28 -28" fill="none" stroke="url(#cordShineM)"
          stroke-width="4.5" stroke-linecap="round"/>

    <!-- evil-eye bead -->
    <g transform="translate(0 6)">
      <circle cx="0" cy="0" r="20" fill="url(#beadWhiteM)"/>
      <circle cx="0" cy="0" r="14.5" fill="url(#beadBlueM)"/>
      <circle cx="0" cy="0" r="8" fill="#EAF6FF"/>
      <circle cx="0" cy="0" r="5" fill="url(#beadPupilM)"/>
      <circle cx="-2.4" cy="-2.4" r="1.7" fill="#FFFFFF"/>
      <circle cx="6" cy="-6" r="2.6" fill="#FFFFFF" fill-opacity="0.85"/>
    </g>

    <!-- sparkle -->
    <path d="M 30 -34 l 1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6 z" fill="#FFD98A"/>
  </g>
</svg>
